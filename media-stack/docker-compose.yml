services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=United States
      - FREE_ONLY=on
      - FIREWALL_OUTBOUND_SUBNETS=${LOCAL_SUBNET}
      - TZ=${TZ}
    ports:
      - "${PROWLARR_PORT}:9696"   # prowlarr
      #- "${QBITTORRENT_PORT}:${QBITTORRENT_PORT}"   # qbittorrent
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_PORTS=${PROWLARR_PORT}/tcp
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr
    depends_on:
      - qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ./radarr/config:/config
      - ./media:/media
    ports:
      - "${RADARR_PORT}:7878"
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"  # video group
      - "993" # render group
    user: 1000:1000
    ports:
      - "${JELLYFIN_PORT}:8096/tcp"
      - "${JELLYFIN_DISCOVERY_PORT}:7359/udp"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - type: bind
        source: ./media
        target: /media
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://${SERVER_IP}:${JELLYFIN_PORT}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Passing through VPN
  # qbittorrent:
  #   image: lscr.io/linuxserver/qbittorrent
  #   container_name: qbittorrent
  #   network_mode: "service:gluetun"
  #   depends_on:
  #     - gluetun
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - WEBUI_PORT=${QBITTORRENT_PORT}
  #     - TZ=${TZ}
  #   volumes:
  #     - ./qbittorrent/config:/config
  #     - ./media/downloads:/downloads
  #   restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=${QBITTORRENT_PORT}
      - TZ=${TZ}
    ports:
      - "${QBITTORRENT_PORT}:${QBITTORRENT_PORT}"
      - "${QBITTORRENT_TORRENT_PORT}:${QBITTORRENT_TORRENT_PORT}/tcp"
      - "${QBITTORRENT_TORRENT_PORT}:${QBITTORRENT_TORRENT_PORT}/udp"
    volumes:
      - ./qbittorrent/config:/config
      - ./media:/media
    restart: unless-stopped